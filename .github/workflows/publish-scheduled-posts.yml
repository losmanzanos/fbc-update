# Publishes scheduled blog posts on their date.
# Every morning it rebuilds the blog lists; if a queued post's date has
# arrived, the lists change, this commits them, and Netlify deploys.
name: Publish scheduled posts

on:
  schedule:
    - cron: "17 13 * * *"   # 7:17 a.m. Denver (MDT), 6:17 a.m. in winter
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build_blog.py
      - name: Commit if anything went live
        run: |
          if git diff --quiet; then echo "Nothing scheduled for today."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Publish scheduled post(s) for $(TZ=America/Denver date +%Y-%m-%d)"
          git push
